<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a6e1ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tiny Explorers">
  <meta name="description" content="A gentle 3D learning game for toddlers: colors, shapes and counting. Works offline.">
  <title>Tiny Explorers 3D</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="Game area"></canvas>

  <div id="start" class="screen">
    <h1>Tiny<br>Explorers</h1>
    <button id="playBtn" class="play-btn" aria-label="Play">&#9654;</button>
    <p class="tagline">Tap to play!</p>
  </div>

  <div id="menu" class="screen hidden">
    <button class="mode-btn" data-mode="colors" style="--c:#ff4f6d;--d:#c9304d"><span>&#127880;</span><b>Colors</b></button>
    <button class="mode-btn" data-mode="shapes" style="--c:#3d8bff;--d:#2563c9"><span>&#11088;</span><b>Shapes</b></button>
    <button class="mode-btn" data-mode="count" style="--c:#2ecc71;--d:#1f9a52"><span>&#127822;</span><b>Count</b></button>
  </div>

  <div id="hud" class="hidden">
    <button id="homeBtn" class="round-btn" aria-label="Home">&#127968;</button>
    <button id="prompt" aria-label="Hear it again"><span id="promptIcon"></span><span id="promptText"></span></button>
    <div id="counter" class="hidden"></div>
  </div>

  <div id="topRight">
    <button id="soundBtn" class="round-btn" aria-label="Sound on or off">&#128266;</button>
    <div id="stars"><span>&#11088;</span><b id="starCount">0</b></div>
  </div>

  <div id="party" class="hidden"></div>

  <script src="vendor/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
