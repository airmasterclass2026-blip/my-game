<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe3b3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Pip's Good Habits: a gentle 3D game that teaches toddlers morning routines, healthy food, tidying up and helping others.">
  <title>Pip's Good Habits</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="habits.css">
</head>
<body>
  <canvas id="scene" aria-label="Pip's house"></canvas>

  <div id="start" class="screen">
    <h1>Pip's Good<br>Habits</h1>
    <button id="playBtn" class="play-btn" aria-label="Play">&#9654;</button>
    <p class="tagline">Tap to play!</p>
  </div>

  <div id="select" class="screen hidden">
    <div class="cards">
      <button class="level-card" data-level="0" style="--c:#ffb020;--d:#d98a00"><i class="badge">1</i><span class="big-emoji">&#9728;&#65039;</span><b>Good Morning</b></button>
      <button class="level-card" data-level="1" style="--c:#2ecc71;--d:#1f9a52"><i class="badge">2</i><span class="big-emoji">&#127822;</span><b>Healthy &amp; Tidy</b></button>
      <button class="level-card" data-level="2" style="--c:#ff6f91;--d:#d94a6e"><i class="badge">3</i><span class="big-emoji">&#129309;</span><b>Helping Hands</b></button>
    </div>
    <a class="more-games" href="index.html">&#127968; More games</a>
  </div>

  <div id="hud" class="hidden">
    <button id="homeBtn" class="round-btn" aria-label="Back">&#127968;</button>
    <button id="prompt" aria-label="Hear it again"><span id="promptIcon"></span><span id="promptText"></span></button>
    <div id="tracker"></div>
  </div>

  <div id="topRight">
    <button id="soundBtn" class="round-btn" aria-label="Sound on or off">&#128266;</button>
    <div id="stars"><span>&#11088;</span><b id="starCount">0</b></div>
  </div>

  <div id="finger" class="hidden">&#128070;</div>
  <div id="party" class="hidden"></div>

  <div id="levelDone" class="screen hidden">
    <div class="done-card">
      <div id="doneEmoji">&#127942;</div>
      <div id="doneText">Great job!</div>
      <div id="doneSteps"></div>
      <div class="done-buttons">
        <button id="replayBtn" class="round-btn big" aria-label="Play again">&#128260;</button>
        <button id="nextBtn" class="play-btn small" aria-label="Next level">&#9654;</button>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="habits.js"></script>
</body>
</html>
